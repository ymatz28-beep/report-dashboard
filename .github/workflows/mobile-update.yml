name: Mobile Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: contains(github.event.issue.labels.*.name, 'update')
    uses: ymatz28-beep/shared-workflows/.github/workflows/claude-issue-handler.yml@main
    with:
      claude_prompt: |
        以下のIssueの指示に従い、このリポジトリのファイルを編集してください。
        HANDOFF.mdがあれば読んで現状を把握してから編集。
      success_comment: |
        反映完了 ✅

        ※ キャッシュがあるため Cmd+Shift+R でハードリロードしてください。
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
