<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iUMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.065);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #f5f5f7;
      --text-secondary: #a1a1aa;
      --muted: #71717a;
      --dim: #3f3f46;
      --gold: #e2c882;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', 'Noto Sans JP', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* === Atmospheric canvas === */
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    .atm-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0;
      animation: orbPulse 8s ease-in-out infinite;
    }

    .atm-orb:nth-child(1) {
      width: 600px; height: 600px;
      top: -15%; left: -10%;
      background: radial-gradient(circle, rgba(59,158,255,0.12), transparent 70%);
      animation-delay: 0s;
    }

    .atm-orb:nth-child(2) {
      width: 500px; height: 500px;
      top: 20%; right: -15%;
      background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%);
      animation-delay: 3s;
    }

    .atm-orb:nth-child(3) {
      width: 400px; height: 400px;
      bottom: -10%; left: 30%;
      background: radial-gradient(circle, rgba(255,107,53,0.06), transparent 70%);
      animation-delay: 5s;
    }

    @keyframes orbPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* === Grain === */
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    }

    /* === Layout === */
    .page {
      position: relative; z-index: 2;
      max-width: 960px; margin: 0 auto;
      padding: 0 32px;
    }

    /* === Navigation === */
    nav {
      padding: 40px 0 0;
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; animation: reveal 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .nav-brand {
      display: flex; align-items: center; gap: 12px;
    }

    .nav-mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b9eff 0%, #8b5cf6 100%);
      display: grid; place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; font-size: 13px;
      color: #fff; letter-spacing: -0.5px;
    }

    .nav-name {
      font-weight: 600; font-size: 14px;
      letter-spacing: 0.04em; color: var(--text);
    }

    .nav-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 500;
      color: var(--muted);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* === Hero === */
    .hero {
      margin-top: 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: end;
      opacity: 0; animation: reveal 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(52px, 7vw, 80px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .hero-accent {
      font-style: italic;
      color: var(--gold);
    }

    .hero-aside {
      padding-bottom: 8px;
    }

    .hero-aside p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
      max-width: 320px;
    }

    .hero-line {
      width: 40px; height: 1px;
      background: var(--gold);
      margin-bottom: 16px;
    }

    /* === Divider === */
    .divider {
      margin: 64px 0 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      opacity: 0; animation: reveal 0.8s ease 0.3s forwards;
    }

    /* === Categories === */
    .categories {
      margin-top: 0;
    }

    .cat-item {
      display: block;
      text-decoration: none;
      color: var(--text);
      position: relative;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .cat-item:hover {
      padding-left: 12px;
    }

    .cat-item::after {
      content: '';
      position: absolute;
      left: 0; bottom: -1px;
      width: 0; height: 1px;
      background: var(--cat-accent);
      transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
    }

    .cat-item:hover::after {
      width: 100%;
    }

    .cat-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 24px;
      align-items: start;
    }

    .cat-ordinal {
      font-family: 'DM Serif Display', serif;
      font-size: 36px;
      line-height: 1;
      color: var(--dim);
      transition: color 0.35s;
      padding-top: 2px;
    }

    .cat-item:hover .cat-ordinal {
      color: var(--cat-accent);
    }

    .cat-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cat-accent);
    }

    .cat-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .cat-badge-live {
      background: rgba(16,185,129,0.12);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.2);
    }

    .cat-badge-soon {
      background: rgba(250,204,21,0.08);
      color: #facc15;
      border: 1px solid rgba(250,204,21,0.15);
    }

    .cat-title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
      transition: color 0.3s;
    }

    .cat-item:hover .cat-title {
      color: var(--cat-accent);
    }

    .cat-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 440px;
    }

    .cat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .cat-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--text-secondary);
      transition: all 0.25s;
    }

    .cat-item:hover .cat-tag {
      border-color: rgba(255,255,255,0.12);
      color: var(--text);
    }

    .cat-arrow {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
      white-space: nowrap;
    }

    .cat-arrow-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: grid; place-items: center;
      font-size: 16px;
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .cat-item:hover .cat-arrow {
      color: var(--cat-accent);
    }

    .cat-item:hover .cat-arrow-icon {
      background: var(--cat-accent);
      border-color: var(--cat-accent);
      color: var(--bg);
      transform: translateX(4px);
    }

    /* === Coming soon === */
    .cat-item.soon {
      cursor: default;
    }

    .cat-item.soon .cat-title,
    .cat-item.soon .cat-desc { opacity: 0.4; }
    .cat-item.soon:hover { padding-left: 0; }
    .cat-item.soon:hover::after { width: 0; }
    .cat-item.soon:hover .cat-ordinal { color: var(--dim); }
    .cat-item.soon:hover .cat-title { color: var(--text); opacity: 0.4; }
    .cat-item.soon .cat-arrow { display: none; }

    /* === Fade-in === */
    .fi {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1),
                  transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }

    .fi.v {
      opacity: 1;
      transform: translateY(0);
    }

    /* === Footer === */
    footer {
      margin-top: 80px;
      padding: 32px 0 48px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0; animation: reveal 0.8s ease 0.6s forwards;
    }

    .foot-left {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.05em;
    }

    .foot-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .foot-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
    }

    .foot-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--dim);
    }

    /* === Animations === */
    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      .page { padding: 0 20px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
        margin-top: 56px;
      }
      .hero h1 { font-size: clamp(40px, 10vw, 56px); }
      .hero-aside { padding-bottom: 0; }
      .cat-row {
        grid-template-columns: 40px 1fr;
        gap: 16px;
      }
      .cat-ordinal { font-size: 28px; }
      .cat-title { font-size: 22px; }
      .cat-arrow { display: none; }
      .cat-item { padding: 28px 0; }
      footer { flex-direction: column; gap: 16px; align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .cat-row { grid-template-columns: 1fr; }
      .cat-ordinal { font-size: 20px; }
    }
  </style>
</head>
<body>

  <div class="atmosphere">
    <div class="atm-orb"></div>
    <div class="atm-orb"></div>
    <div class="atm-orb"></div>
  </div>
  <div class="grain"></div>

  <div class="page">

    <nav>
      <div class="nav-brand">
        <div class="nav-mark">iU</div>
        <div class="nav-name">iUMA</div>
      </div>
      <div class="nav-tag">v2.0</div>
    </nav>

    <div class="hero">
      <h1>Intelligent<br><span class="hero-accent">Analytics.</span></h1>
      <div class="hero-aside">
        <div class="hero-line"></div>
        <p>不動産・旅行・投資の分析レポートを一元管理。<br>自動収集からスコアリング、レポート生成まで。</p>
      </div>
    </div>

    <div class="divider"></div>

    <div class="categories" id="categories"></div>

    <footer>
      <div class="foot-left">iUMA PROPERTY MANAGEMENT &mdash; 2026</div>
      <div class="foot-right">
        <div class="foot-dot"></div>
        <div class="foot-text">UNIFIED DASHBOARD</div>
      </div>
    </footer>

  </div>

  <script>
    /**
     * iUMA Dashboard v2 — Data-driven editorial layout
     *
     * SSF:
     *   Scalable   — CATEGORIES配列に1オブジェクト追加 = 新カテゴリ
     *   Sustainable — 各プロジェクト独立デプロイ。リンクハブのみ
     *   Flexible   — status "live"/"soon"、tags/url自由構成
     */
    var CATEGORIES = [
      {
        id: "real-estate",
        label: "Real Estate",
        accent: "#3b9eff",
        cards: [
          {
            status: "live",
            title: "民泊物件検索",
            desc: "3都市の中古マンション候補をスコアリング。毎日自動巡回・更新。",
            tags: ["大阪", "福岡", "東京", "内覧分析"],
            url: "https://ymatz28-beep.github.io/property-report/",
            action: "レポートを見る"
          }
        ]
      },
      {
        id: "travel",
        label: "Travel",
        accent: "#ff6b35",
        cards: [
          {
            status: "live",
            title: "旅行プランナー",
            desc: "目的地別の最適プラン。フライト・宿泊・アクティビティを自動最適化。",
            tags: ["London 3/27\u20134/5", "Macau 3/5\u201310"],
            url: "https://ymatz28-beep.github.io/trip-planner/",
            action: "プランを見る"
          }
        ]
      },
      {
        id: "stocks",
        label: "Stocks",
        accent: "#8b5cf6",
        cards: [
          {
            status: "live",
            title: "ポートフォリオ分析",
            desc: "保有銘柄のファンダメンタルズ \u00d7 テクニカル分析。パフォーマンスレポート。",
            tags: ["Portfolio"],
            url: "https://ymatz28-beep.github.io/report-dashboard/stock/portfolio.html",
            action: "分析を見る"
          }
        ]
      }
    ];

    function pad(n) { return n < 10 ? "0" + n : "" + n; }

    function renderCategories() {
      var container = document.getElementById("categories");
      var items = [];

      CATEGORIES.forEach(function(cat, catIdx) {
        cat.cards.forEach(function(card) {
          var isLive = card.status === "live";
          var el = document.createElement(isLive ? "a" : "div");
          if (isLive && card.url) el.href = card.url;
          el.className = "cat-item fi" + (isLive ? "" : " soon");
          el.style.setProperty("--cat-accent", cat.accent);

          var badgeClass = isLive ? "cat-badge-live" : "cat-badge-soon";
          var badgeText = isLive ? "LIVE" : "COMING SOON";

          var tagsHtml = (card.tags || []).map(function(t) {
            return '<span class="cat-tag">' + t + '</span>';
          }).join("");

          var arrowHtml = isLive
            ? '<div class="cat-arrow"><div class="cat-arrow-icon">\u2192</div></div>'
            : '';

          el.innerHTML =
            '<div class="cat-row">' +
              '<div class="cat-ordinal">' + pad(catIdx + 1) + '</div>' +
              '<div class="cat-body">' +
                '<div class="cat-header">' +
                  '<span class="cat-label">' + cat.label + '</span>' +
                  '<span class="cat-badge ' + badgeClass + '">' + badgeText + '</span>' +
                '</div>' +
                '<div class="cat-title">' + card.title + '</div>' +
                '<div class="cat-desc">' + card.desc + '</div>' +
                (tagsHtml ? '<div class="cat-tags">' + tagsHtml + '</div>' : '') +
              '</div>' +
              arrowHtml +
            '</div>';

          items.push(el);
          container.appendChild(el);
        });
      });

      // Staggered reveal
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          items.forEach(function(el, i) {
            setTimeout(function() {
              el.classList.add("v");
            }, 400 + i * 120);
          });
        });
      });
    }

    renderCategories();
  </script>
</body>
</html>
