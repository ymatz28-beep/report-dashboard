<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iUMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.065);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #f5f5f7;
      --text-secondary: #a1a1aa;
      --muted: #71717a;
      --dim: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', 'Noto Sans JP', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .atm-orb {
      position: absolute; border-radius: 50%; filter: blur(140px);
      opacity: 0; animation: orbPulse 10s ease-in-out infinite;
    }
    .atm-orb:nth-child(1) {
      width: 600px; height: 600px; top: -12%; left: -8%;
      background: radial-gradient(circle, rgba(59,158,255,0.08), transparent 70%);
    }
    .atm-orb:nth-child(2) {
      width: 500px; height: 500px; bottom: 20%; right: -12%;
      background: radial-gradient(circle, rgba(255,107,53,0.06), transparent 70%);
      animation-delay: 3.5s;
    }
    .atm-orb:nth-child(3) {
      width: 450px; height: 450px; bottom: -8%; left: 30%;
      background: radial-gradient(circle, rgba(34,197,94,0.05), transparent 70%);
      animation-delay: 7s;
    }
    @keyframes orbPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); }
    }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    }

    .page { position: relative; z-index: 2; max-width: 960px; margin: 0 auto; padding: 0 32px; }

    nav {
      padding: 40px 0 0;
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; animation: reveal 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #f5f5f7 0%, #a1a1aa 100%);
      display: grid; place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; font-size: 13px; color: #050507; letter-spacing: -0.5px;
    }
    .nav-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    .nav-status {
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--dim); letter-spacing: 0.05em;
    }
    .nav-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; animation: statusPulse 3s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
    }

    .hero {
      margin-top: 100px; text-align: center;
      opacity: 0; animation: reveal 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(72px, 12vw, 140px);
      font-weight: 400; line-height: 0.9; letter-spacing: -0.03em;
      color: var(--text);
    }
    .hero-dot {
      font-style: italic;
      background: linear-gradient(135deg, #3b9eff, #ff6b35, #22c55e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted);
    }
    .hero-line {
      width: 48px; height: 1px; margin: 32px auto 0;
      background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    }
    .hero-desc {
      margin-top: 24px;
      font-size: 15px; color: var(--text-secondary); line-height: 1.8;
      max-width: 440px; margin-left: auto; margin-right: auto;
    }

    .divider {
      margin: 80px 0 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      opacity: 0; animation: reveal 0.8s ease 0.3s forwards;
    }

    .categories { margin-top: 0; }

    .cat-item {
      display: block; text-decoration: none; color: var(--text);
      position: relative; padding: 48px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .cat-item:hover { padding-left: 12px; }
    .cat-item::after {
      content: ''; position: absolute; left: 0; bottom: -1px;
      width: 0; height: 2px;
      transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .cat-item:hover::after { width: 100%; }

    .cat-row {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 28px; align-items: start;
    }

    .cat-ordinal {
      font-family: 'DM Serif Display', serif;
      font-size: 42px; line-height: 1; color: var(--dim);
      transition: color 0.35s; padding-top: 2px;
    }

    .cat-body { display: flex; flex-direction: column; gap: 12px; }

    .cat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .cat-title {
      font-family: 'DM Serif Display', serif;
      font-size: 32px; font-weight: 400; line-height: 1.15;
      transition: color 0.3s;
    }

    .cat-desc {
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
      max-width: 480px;
    }

    .cat-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .cat-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 500; padding: 5px 12px; border-radius: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-secondary); transition: all 0.3s;
    }

    .cat-arrow {
      align-self: center; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); display: grid; place-items: center;
      font-size: 18px; color: var(--muted);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .fi {
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .fi.v { opacity: 1; transform: translateY(0); }

    footer {
      margin-top: 100px; padding: 32px 0 56px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; animation: reveal 0.8s ease 0.6s forwards;
    }
    .foot-left, .foot-right {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim);
      letter-spacing: 0.06em;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .page { padding: 0 20px; }
      .hero { margin-top: 64px; }
      .hero h1 { font-size: clamp(56px, 14vw, 100px); }
      .cat-row { grid-template-columns: 48px 1fr; gap: 16px; }
      .cat-arrow { display: none; }
      .cat-ordinal { font-size: 32px; }
      .cat-title { font-size: 24px; }
      .cat-item { padding: 32px 0; }
      .divider { margin: 56px 0 0; }
      footer { flex-direction: column; gap: 16px; align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .cat-row { grid-template-columns: 1fr; }
      .cat-ordinal { font-size: 24px; }
      .hero-desc { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere">
    <div class="atm-orb"></div>
    <div class="atm-orb"></div>
    <div class="atm-orb"></div>
  </div>
  <div class="grain"></div>

  <div class="page">
    <nav>
      <div class="nav-brand">
        <div class="nav-mark">iU</div>
        <div class="nav-name">Report Dashboard</div>
      </div>
      <div class="nav-status">
        <div class="nav-dot"></div>
        <span>Systems Online</span>
      </div>
    </nav>

    <div class="hero">
      <h1>iUMA<span class="hero-dot">.</span></h1>
      <div class="hero-sub">Report Dashboard</div>
      <div class="hero-line"></div>
      <p class="hero-desc">
        自動生成レポートの統合ハブ。<br>
        不動産・旅行・日次アクションを一元管理。
      </p>
    </div>

    <div class="divider"></div>
    <div class="categories" id="categories"></div>

    <footer>
      <div class="foot-left">iUMA &mdash; 2026</div>
      <div class="foot-right">AUTO-GENERATED REPORTS</div>
    </footer>
  </div>

  <script>
    var CATEGORIES = [
      {
        label: "Real Estate",
        title: "Property Reports",
        desc: "\u6c11\u6cca\u7269\u4ef6\u691c\u7d22\u30fb\u5185\u89a7\u5206\u6790\u30ec\u30dd\u30fc\u30c8\u3002\u5927\u962a\u30fb\u798f\u5ca1\u30fb\u6771\u4eac\u306e\u5019\u88dc\u7269\u4ef6\u3092\u6bce\u65e5\u81ea\u52d5\u5de1\u56de\u30fb\u30b9\u30b3\u30a2\u30ea\u30f3\u30b0\u3002",
        tags: ["\u5927\u962a", "\u798f\u5ca1", "\u6771\u4eac", "\u5185\u89a7\u5206\u6790"],
        url: "https://ymatz28-beep.github.io/property-report/",
        accent: "#3b9eff"
      },
      {
        label: "Travel",
        title: "Trip Planner",
        desc: "\u65c5\u884c\u30d7\u30e9\u30f3\u30fb\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\u751f\u6210\u3002\u884c\u304d\u5148\u30fb\u65e5\u7a0b\u30fb\u4e88\u7b97\u306b\u5fdc\u3058\u305f\u6700\u9069\u30d7\u30e9\u30f3\u3092\u81ea\u52d5\u8a2d\u8a08\u3002",
        tags: ["Trip Planning"],
        url: "https://ymatz28-beep.github.io/trip-planner/",
        accent: "#ff6b35"
      },
      {
        label: "Daily Ops",
        title: "Daily Actions",
        desc: "\u30c7\u30a4\u30ea\u30fc\u30a2\u30af\u30b7\u30e7\u30f3\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3002\u6bce\u65e5\u306e\u30bf\u30b9\u30af\u30fb\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\u3092\u81ea\u52d5\u751f\u6210\u30fb\u53ef\u8996\u5316\u3002",
        tags: ["Daily", "Actions"],
        url: "action/index.html",
        accent: "#22c55e"
      }
    ];

    function pad(n) { return n < 10 ? "0" + n : "" + n; }

    function hexToRgb(hex) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return r + "," + g + "," + b;
    }

    function render() {
      var container = document.getElementById("categories");
      var items = [];

      CATEGORIES.forEach(function(c, i) {
        var el = document.createElement("a");
        el.href = c.url;
        el.className = "cat-item fi";

        var rgb = hexToRgb(c.accent);

        el.style.setProperty("--cat-accent", c.accent);
        el.style.setProperty("--cat-rgb", rgb);

        var tagsHtml = (c.tags || []).map(function(t) {
          return '<span class="cat-tag">' + t + '</span>';
        }).join("");

        el.innerHTML =
          '<div class="cat-row">' +
            '<div class="cat-ordinal">' + pad(i + 1) + '</div>' +
            '<div class="cat-body">' +
              '<div class="cat-label" style="color:' + c.accent + '">' + c.label + '</div>' +
              '<div class="cat-title">' + c.title + '</div>' +
              '<div class="cat-desc">' + c.desc + '</div>' +
              (tagsHtml ? '<div class="cat-tags">' + tagsHtml + '</div>' : '') +
            '</div>' +
            '<div class="cat-arrow">\u2192</div>' +
          '</div>';

        var style = document.createElement("style");
        style.textContent =
          '.cat-item:nth-child(' + (i + 1) + ')::after { background: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-ordinal { color: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-title { color: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-arrow { background: ' + c.accent + '; border-color: ' + c.accent + '; color: #050507; transform: translateX(4px); }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-tag { border-color: rgba(' + rgb + ',0.2); color: ' + c.accent + '; }';
        document.head.appendChild(style);

        items.push(el);
        container.appendChild(el);
      });

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          items.forEach(function(el, i) {
            setTimeout(function() { el.classList.add("v"); }, 400 + i * 150);
          });
        });
      });
    }

    render();
  </script>
</body>
</html>
