<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iUMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.065);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #f5f5f7;
      --text-secondary: #a1a1aa;
      --muted: #71717a;
      --dim: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .atm-orb {
      position: absolute; border-radius: 50%; filter: blur(140px);
      opacity: 0; animation: orbPulse 10s ease-in-out infinite;
    }
    .atm-orb:nth-child(1) {
      width: 600px; height: 600px; top: -12%; left: -8%;
      background: radial-gradient(circle, rgba(59,158,255,0.08), transparent 70%);
    }
    .atm-orb:nth-child(2) {
      width: 500px; height: 500px; bottom: 20%; right: -12%;
      background: radial-gradient(circle, rgba(255,107,53,0.06), transparent 70%);
      animation-delay: 3.5s;
    }
    @keyframes orbPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); }
    }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    }

    /* ── Shared Gnav ── */
    .site-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
      background: rgba(22,24,31,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .site-brand {
      font-size: 18px; font-weight: 700; color: #a78bfa;
      letter-spacing: 0.04em;
    }
    .site-nav { display: flex; gap: 4px; }
    .site-nav a {
      color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500;
      padding: 6px 14px; border-radius: 6px; transition: background .15s, color .15s;
    }
    .site-nav a:hover, .site-nav a[aria-current="page"] {
      background: var(--surface-hover); color: var(--text);
    }
    .nav-toggle { display: none; }
    .nav-toggle-label { display: none; cursor: pointer; padding: 8px; }
    .nav-toggle-label span,
    .nav-toggle-label span::before,
    .nav-toggle-label span::after {
      display: block; background: var(--text); height: 2px; width: 20px;
      border-radius: 2px; position: relative; transition: .3s;
    }
    .nav-toggle-label span::before,
    .nav-toggle-label span::after { content: ''; position: absolute; }
    .nav-toggle-label span::before { top: -6px; }
    .nav-toggle-label span::after { top: 6px; }
    @media (max-width: 640px) {
      .nav-toggle-label { display: block; }
      .site-nav {
        display: none; flex-direction: column; gap: 0;
        position: absolute; top: 52px; left: 0; right: 0;
        background: rgba(22,24,31,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
      }
      .site-nav a { padding: 12px 24px; border-radius: 0; font-size: 14px; }
      .nav-toggle:checked ~ .site-nav { display: flex; }
      .nav-toggle:checked ~ .nav-toggle-label span { background: transparent; }
      .nav-toggle:checked ~ .nav-toggle-label span::before { top: 0; transform: rotate(45deg); }
      .nav-toggle:checked ~ .nav-toggle-label span::after { top: 0; transform: rotate(-45deg); }
    }

    .page { position: relative; z-index: 2; max-width: 960px; margin: 0 auto; padding: 0 32px; }

    /* ── Subtitle (replaces hero) ── */
    .page-intro {
      margin-top: 48px; text-align: center;
      opacity: 0; animation: reveal 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }
    .page-intro p {
      font-size: 14px; color: var(--text-secondary); line-height: 1.8;
    }
    .intro-line {
      width: 48px; height: 1px; margin: 20px auto 0;
      background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    }

    .divider {
      margin: 40px 0 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      opacity: 0; animation: reveal 0.8s ease 0.3s forwards;
    }

    .categories { margin-top: 0; }

    .cat-item {
      display: block; text-decoration: none; color: var(--text);
      position: relative; padding: 48px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .cat-item:hover { padding-left: 12px; }
    .cat-item::after {
      content: ''; position: absolute; left: 0; bottom: -1px;
      width: 0; height: 2px;
      transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .cat-item:hover::after { width: 100%; }

    .cat-row {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 28px; align-items: start;
    }

    .cat-ordinal {
      font-size: 42px; font-weight: 300; line-height: 1; color: var(--dim);
      transition: color 0.35s; padding-top: 2px;
    }

    .cat-body { display: flex; flex-direction: column; gap: 12px; }

    .cat-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .cat-title {
      font-size: 28px; font-weight: 600; line-height: 1.15;
      transition: color 0.3s;
    }

    .cat-desc {
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
      max-width: 480px;
    }

    .cat-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .cat-tag {
      font-size: 10px; font-weight: 500; padding: 5px 12px; border-radius: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-secondary); transition: all 0.3s;
    }

    .cat-arrow {
      align-self: center; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); display: grid; place-items: center;
      font-size: 18px; color: var(--muted);
      transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .fi {
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .fi.v { opacity: 1; transform: translateY(0); }

    footer {
      margin-top: 100px; padding: 32px 0 56px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; animation: reveal 0.8s ease 0.6s forwards;
    }
    .foot-left, .foot-right {
      font-size: 10px; font-weight: 500; color: var(--dim);
      letter-spacing: 0.06em;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .page { padding: 0 20px; }
      .page-intro { margin-top: 32px; }
      .cat-row { grid-template-columns: 48px 1fr; gap: 16px; }
      .cat-arrow { display: none; }
      .cat-ordinal { font-size: 32px; }
      .cat-title { font-size: 22px; }
      .cat-item { padding: 32px 0; }
      .divider { margin: 32px 0 0; }
      footer { flex-direction: column; gap: 16px; align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .cat-row { grid-template-columns: 1fr; }
      .cat-ordinal { font-size: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere">
    <div class="atm-orb"></div>
    <div class="atm-orb"></div>
  </div>
  <div class="grain"></div>

  <header class="site-header">
    <div class="site-brand">iUMA</div>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
    <label for="nav-toggle" class="nav-toggle-label"><span></span></label>
    <nav class="site-nav" aria-label="Site navigation">
      <a href="https://iuma-private.pages.dev/stock/portfolio.html">Stock</a>
      <a href="https://ymatz28-beep.github.io/property-report/">Property</a>
      <a href="https://iuma-private.pages.dev/wealth/dashboard.html">Wealth</a>
      <a href="https://iuma-private.pages.dev/action/">Action</a>
    </nav>
  </header>

  <div class="page">
    <div class="page-intro">
      <p>自動生成レポートの統合ハブ</p>
      <div class="intro-line"></div>
    </div>

    <div class="divider"></div>
    <div class="categories" id="categories"></div>

    <footer>
      <div class="foot-left">iUMA &mdash; 2026</div>
      <div class="foot-right">AUTO-GENERATED REPORTS</div>
    </footer>
  </div>

  <script>
    var CATEGORIES = [
      {
        label: "Real Estate",
        title: "Property Reports",
        desc: "\u6c11\u6cca\u7269\u4ef6\u691c\u7d22\u30fb\u5185\u89a7\u5206\u6790\u30ec\u30dd\u30fc\u30c8\u3002\u5927\u962a\u30fb\u798f\u5ca1\u30fb\u6771\u4eac\u306e\u5019\u88dc\u7269\u4ef6\u3092\u6bce\u65e5\u81ea\u52d5\u5de1\u56de\u30fb\u30b9\u30b3\u30a2\u30ea\u30f3\u30b0\u3002",
        tags: ["\u5927\u962a", "\u798f\u5ca1", "\u6771\u4eac", "\u5185\u89a7\u5206\u6790"],
        url: "https://ymatz28-beep.github.io/property-report/",
        accent: "#3b9eff"
      },
      {
        label: "Travel",
        title: "Trip Planner",
        desc: "\u65c5\u884c\u30d7\u30e9\u30f3\u30fb\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\u751f\u6210\u3002\u884c\u304d\u5148\u30fb\u65e5\u7a0b\u30fb\u4e88\u7b97\u306b\u5fdc\u3058\u305f\u6700\u9069\u30d7\u30e9\u30f3\u3092\u81ea\u52d5\u8a2d\u8a08\u3002",
        tags: ["Trip Planning"],
        url: "https://ymatz28-beep.github.io/trip-planner/",
        accent: "#ff6b35"
      },
    ];

    function pad(n) { return n < 10 ? "0" + n : "" + n; }

    function hexToRgb(hex) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return r + "," + g + "," + b;
    }

    function render() {
      var container = document.getElementById("categories");
      var items = [];

      CATEGORIES.forEach(function(c, i) {
        var el = document.createElement("a");
        el.href = c.url;
        el.className = "cat-item fi";

        var rgb = hexToRgb(c.accent);

        el.style.setProperty("--cat-accent", c.accent);
        el.style.setProperty("--cat-rgb", rgb);

        var tagsHtml = (c.tags || []).map(function(t) {
          return '<span class="cat-tag">' + t + '</span>';
        }).join("");

        el.innerHTML =
          '<div class="cat-row">' +
            '<div class="cat-ordinal">' + pad(i + 1) + '</div>' +
            '<div class="cat-body">' +
              '<div class="cat-label" style="color:' + c.accent + '">' + c.label + '</div>' +
              '<div class="cat-title">' + c.title + '</div>' +
              '<div class="cat-desc">' + c.desc + '</div>' +
              (tagsHtml ? '<div class="cat-tags">' + tagsHtml + '</div>' : '') +
            '</div>' +
            '<div class="cat-arrow">\u2192</div>' +
          '</div>';

        var style = document.createElement("style");
        style.textContent =
          '.cat-item:nth-child(' + (i + 1) + ')::after { background: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-ordinal { color: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-title { color: ' + c.accent + '; }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-arrow { background: ' + c.accent + '; border-color: ' + c.accent + '; color: #050507; transform: translateX(4px); }' +
          '.cat-item:nth-child(' + (i + 1) + '):hover .cat-tag { border-color: rgba(' + rgb + ',0.2); color: ' + c.accent + '; }';
        document.head.appendChild(style);

        items.push(el);
        container.appendChild(el);
      });

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          items.forEach(function(el, i) {
            setTimeout(function() { el.classList.add("v"); }, 400 + i * 150);
          });
        });
      });
    }

    render();
  </script>
</body>
</html>
